{% extends "base.html" %}
{% block content %}
<div style="max-width: 450px; margin: 80px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 4px solid #FF0000;">
    <h1 style="text-align: center; margin-top: 0; font-size: 36px;"><span class="airtel-red">airtel</span> priority</h1>
    <h3 style="text-align: center; color: #718096; margin-bottom: 35px; font-weight: 500;">WOW Project Tracker</h3>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #4A5568; font-weight: 600;">Airtel Email ID</label>
            <input type="email" name="email" required placeholder="name@airtel.com" style="width: 100%; padding: 12px 15px; border: 1px solid #E2E8F0; border-radius: 6px; box-sizing: border-box; background-color: #F8FAFC;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #4A5568; font-weight: 600;">OLM ID</label>
            <input type="text" name="olm" required placeholder="Enter OLM ID" style="width: 100%; padding: 12px 15px; border: 1px solid #E2E8F0; border-radius: 6px; box-sizing: border-box; background-color: #F8FAFC;">
        </div>
        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 8px; color: #4A5568; font-weight: 600;">Select Circle</label>
            <select name="circle" required style="width: 100%; padding: 12px 15px; border: 1px solid #E2E8F0; border-radius: 6px; box-sizing: border-box; background-color: #F8FAFC; cursor: pointer;">
                <option value="">Select your circle...</option>
                {% for c in circles %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" style="width: 100%; padding: 15px; background-color: #FF0000; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s;">Access Workspace</button>
    </form>
</div>
{% endblock %}
