{% extends "base.html" %}
{% block content %}
<h2 style="font-size: 28px;"><span class="airtel-red">System</span> Audit Log</h2>
<h3 style="color: #4A5568; font-weight: 500; margin-bottom: 20px;"><i class="fa-solid fa-clock-rotate-left"></i> Today's Upload Activity</h3>

<div class="table-container" style="overflow-x: auto;">
    {% if table %}
        {{ table|safe }}
    {% else %}
        <div style="padding: 30px; text-align: center; color: #718096; background: #fff;">
            <i class="fa-solid fa-bed" style="font-size: 40px; margin-bottom: 15px; color: #CBD5E0;"></i>
            <p>No upload activity recorded in the system today.</p>
        </div>
    {% endif %}
</div>
{% endblock %}
